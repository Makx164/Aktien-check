<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) { registration.unregister(); });
      }).catch(function () {});
    }
  </script>
  <script>try{var t=localStorage.getItem("ac-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c6c7c1">
  <title>sidequest</title>
  <meta name="description" content="Kennzahlen zu ausgewählten Aktien, mit Quelle und Stand. Kein Score, keine Anlageberatung.">
  <meta property="og:title" content="sidequest">
  <meta property="og:description" content="Kennzahlen zu ausgewählten Aktien, mit Quelle und Stand. Kein Score, keine Anlageberatung.">
  <meta property="og:url" content="https://yoursidequest.org/">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23e8305a'/%3E%3Cpath d='M5 17l5-5 3 3 6-7' fill='none' stroke='%23111' stroke-width='2.6'/%3E%3C/svg%3E">
  <link rel="canonical" href="https://yoursidequest.org/">
  <style>
@font-face{font-family:"Space Mono";src:url("fonts/space-mono-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Space Mono";src:url("fonts/space-mono-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono.woff2") format("woff2");font-weight:100 800;font-display:swap}
@font-face{font-family:"Space Grotesk";src:url("fonts/space-grotesk.woff2") format("woff2");font-weight:300 700;font-display:swap}
:root,[data-theme="light"]{
  --bg:#c6c7c1; --bg2:#cfd0ca; --panel:#d3d4ce; --panel2:#dcddd7; --ink:#111214; --ink2:#3a3c40; --mut:#5f625f;
  --hair:rgba(17,18,20,.55); --hair2:rgba(17,18,20,.22); --grid:rgba(17,18,20,.045);
  --red:#e8305a; --red-ink:#c41c45; --blue:#2b55e0; --bad:#c41c3a; --bad-bg:rgba(196,28,58,.10);
  --scan:none; color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0a0b0c; --bg2:#0f1012; --panel:#111316; --panel2:#171a1e; --ink:#eceeee; --ink2:#c3c6c8; --mut:#8a8f93;
  --hair:rgba(236,238,238,.42); --hair2:rgba(236,238,238,.16); --grid:rgba(236,238,238,.035);
  --red:#ff3b63; --red-ink:#ff5a7c; --blue:#6f93ff; --bad:#ff4d66; --bad-bg:rgba(255,77,102,.10);
  --scan:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:var(--scan),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
.mlabel{display:inline-block;font:600 11px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.shell{position:relative;max-width:1060px;margin:26px auto 34px;border:1px solid var(--hair);background:color-mix(in srgb,var(--bg) 80%,transparent)}
.cx{position:absolute;width:19px;height:19px;pointer-events:none}
.cx::before,.cx::after{content:"";position:absolute;background:var(--ink)}
.cx::before{left:9px;top:0;width:1px;height:19px} .cx::after{top:9px;left:0;height:1px;width:19px}
.cx.tl{left:-10px;top:-10px} .cx.tr{right:-10px;top:-10px} .cx.bl{left:-10px;bottom:-10px} .cx.br{right:-10px;bottom:-10px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 26px;border-bottom:1px solid var(--hair2)}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)} .brand:hover{text-decoration:none}
.logo{width:26px;height:26px;color:var(--ink)} .logo svg{width:100%;height:100%}
.brand-t{font:700 16px/1.1 "Space Mono",monospace;letter-spacing:.08em;text-transform:none}
.theme-tg{display:flex;border:1px solid var(--hair);background:transparent;padding:0;cursor:pointer;font:600 10.5px "JetBrains Mono",monospace;letter-spacing:.14em}
.theme-tg span{padding:5px 9px;color:var(--mut)}
[data-theme="light"] .theme-tg [data-v="light"],[data-theme="dark"] .theme-tg [data-v="dark"]{background:var(--ink);color:var(--bg)}
main{position:relative;padding:8px 26px 30px;outline:none}
.footer{padding:0 26px 22px}
.discl-big{border:1px solid var(--bad);background:var(--bad-bg);padding:12px 14px;font-size:13px;color:var(--ink2)}
.discl-big .mlabel{color:var(--bad);margin-bottom:4px;display:block}
.foot-band{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px}
.footer .discl-big.compact{flex:1 1 320px;margin-top:12px}
.foot-legal{flex:0 0 auto;margin:12px 0 0;text-align:right;font:500 11px "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.foot-legal a{color:var(--ink2)} .foot-legal a:hover{color:var(--ink)}
.foot-legal .sep{margin:0 8px;color:var(--mut)}
.foot-legal a[aria-current="page"]{color:var(--ink)}
.foot-url{text-align:center;font:500 11px "JetBrains Mono",monospace;letter-spacing:.16em;color:var(--ink2);margin:12px 0 0}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--hair2)}
.sec-t h2{margin:0;font:700 15px "Space Mono",monospace;letter-spacing:.1em;text-transform:uppercase}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:8px 0 12px}
.tile{display:flex;flex-direction:column;gap:8px;min-height:132px;padding:14px;border:1px solid var(--hair);background:var(--panel);color:inherit;text-decoration:none}
.tile:hover{background:var(--panel2);text-decoration:none;border-color:var(--ink)}
.tile-ticker{font:700 22px/1 "Space Mono",monospace;letter-spacing:.08em;color:var(--ink)}
.tile-name{font:500 12px/1.35 "JetBrains Mono",monospace;color:var(--mut);letter-spacing:.03em}
.tile-stand{margin-top:auto;padding-top:10px;font:500 11px/1.35 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.tile-stand b{display:block;margin-bottom:2px;color:var(--red-ink);font-size:10px;letter-spacing:.12em}
.back{display:inline-block;margin:10px 0 4px;font:600 11.5px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
.h-red{font:700 clamp(54px,11vw,104px)/.95 "Space Mono",monospace;color:var(--red);letter-spacing:.01em;margin:8px 0 0;text-transform:uppercase}
.r-name{font:700 clamp(15px,2.4vw,21px)/1.25 "Space Mono",monospace;letter-spacing:.06em;text-transform:uppercase;margin:8px 0 14px}
.term{font:500 12.5px/1.75 "JetBrains Mono",monospace;color:var(--ink2)}
.term b{color:var(--ink);font-weight:700}
.thesis{font-size:18px;line-height:1.45;max-width:68ch;margin:8px 0 0}
.thesis.placeholder{color:var(--mut);font-style:italic}
.wrap{overflow-x:auto;margin-top:18px;border:1px solid var(--hair)}
table.metrics{width:100%;border-collapse:collapse;font:500 13px/1.45 "JetBrains Mono",monospace}
table.metrics th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:10px 12px;border-bottom:1px solid var(--hair);background:var(--panel)}
table.metrics td{padding:12px;border-bottom:1px solid var(--hair2);vertical-align:top}
table.metrics tr:last-child td{border-bottom:0}
table.metrics .val{font:700 15px "Space Mono",monospace;color:var(--ink)}
table.metrics .sub{display:block;margin-top:4px;color:var(--mut);font:500 11.5px/1.4 "JetBrains Mono",monospace;white-space:normal}
.facts{margin:14px 0 0;color:var(--ink2);font:500 12.5px "JetBrains Mono",monospace}
@media (max-width:640px){
  .shell{margin:14px 10px 24px}
  .topbar{padding:12px 14px} main{padding:4px 14px 12px} .footer{padding:0 14px 18px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}
  .tile{min-height:118px;padding:12px 10px}
  .tile-ticker{font-size:16px}
  .foot-legal{flex:1 1 100%;text-align:center}
}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="sidequest, alle Positionen">
        <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 22 20H2Z" fill="currentColor"/><path d="M12 11 15.5 17h-7Z" fill="var(--bg)"/></svg></span>
        <span class="brand-t">sidequest</span>
      </a>
      <div class="top-r">
        <button class="theme-tg" id="theme-tg" type="button" aria-label="Farbschema wechseln">
          <span data-v="light">LIGHT</span><span data-v="dark">OPS</span>
        </button>
      </div>
    </header>
    <main id="app" tabindex="-1"><p class="mlabel">Daten werden geladen.</p></main>
    <footer class="footer">
      <div class="foot-band">
        <div class="discl-big compact"><span class="mlabel">KEINE ANLAGEBERATUNG</span>Keine Anlageberatung und keine Kauf- oder Verkaufsempfehlung. Die Kennzahlen sind öffentliche Unternehmensdaten mit Quelle und Stand. Sie können unvollständig oder veraltet sein und ersetzen keine eigene Prüfung.</div>
        <nav class="foot-legal" aria-label="Rechtliches">
          <a href="impressum.html">Impressum</a><span class="sep" aria-hidden="true">·</span><a href="datenschutz.html">Datenschutz</a>
        </nav>
      </div>
      <p class="foot-url">sidequest</p>
    </footer>
    <i class="cx tl"></i><i class="cx tr"></i><i class="cx bl"></i><i class="cx br"></i>
  </div>
  <script>
(function () {
  "use strict";
  var TICKERS = ["PLTR","OSS","AMZN","TSLA","HIMS","LMND","IBRX","MU","IREN","GRAB"];
  var DASH = "—";
  var app = document.getElementById("app");
  var loaded = [];

  var tg = document.getElementById("theme-tg");
  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("ac-theme", t); } catch (e) {}
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = t === "dark" ? "#0a0b0c" : "#c6c7c1";
  }
  tg.addEventListener("click", function () {
    setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });
  var qt = (location.search.match(/[?&]theme=(light|dark)/) || [])[1];
  if (qt) setTheme(qt);

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
    });
  }
  function dDE(iso) {
    if (!iso) return DASH;
    var p = String(iso).slice(0, 10).split("-");
    return p.length === 3 ? p[2] + "." + p[1] + "." + p[0] : String(iso);
  }
  function shown(value) {
    return value == null || value === "" ? DASH : String(value);
  }
  function priceText(doc) {
    var price = doc.price;
    if (!price || price.close == null || price.close === "") return DASH;
    var number = Number(price.close);
    if (!isFinite(number)) return DASH;
    var text = number.toFixed(2).replace(".", ",");
    if (price.currency) text += " " + price.currency;
    return text;
  }

  function renderTile(doc) {
    var link = document.createElement("a");
    link.className = "tile";
    link.href = "#/" + doc.ticker;
    var ticker = document.createElement("span");
    ticker.className = "tile-ticker";
    ticker.textContent = doc.ticker;
    var name = document.createElement("span");
    name.className = "tile-name";
    name.textContent = doc.name || "";
    var stand = document.createElement("span");
    stand.className = "tile-stand";
    var label = document.createElement("b");
    label.textContent = "Stand der Daten";
    stand.append(label, document.createTextNode(dDE(doc.asOf)));
    link.append(ticker, name, stand);
    return link;
  }

  function showGrid() {
    document.title = "sidequest";
    var ready = loaded.filter(function (item) { return item.ok; });
    var grid = document.createElement("div");
    grid.className = "tiles";
    ready.forEach(function (item) { grid.append(renderTile(item.doc)); });
    var kicker = document.createElement("div");
    kicker.className = "sec-t";
    kicker.innerHTML = "<h2>Übersicht</h2><span class=\"mlabel\">" + ready.length + " Ticker · Kennzahlen, kein Score</span>";
    app.replaceChildren(kicker, grid);
  }

  function metricRows(doc) {
    return (doc.metrics || []).map(function (metric) {
      var value = metric.value == null ? DASH : shown(metric.display);
      var extra = "";
      if (metric.detail) extra += '<span class="sub">' + esc(metric.detail) + "</span>";
      if (metric.note) extra += '<span class="sub">' + esc(metric.note) + "</span>";
      var source = metric.sourceUrl
        ? '<a href="' + esc(metric.sourceUrl) + '" rel="noopener noreferrer">' + esc(metric.source || "Quelle") + "</a>"
        : esc(metric.source || DASH);
      return "<tr><th scope=\"row\">" + esc(metric.label || "") + "</th><td class=\"val\">" + esc(value) + extra +
        "</td><td>" + esc(shown(metric.period)) + "</td><td>" + source + "</td><td>" + esc(dDE(metric.fetchedAt)) + "</td></tr>";
    }).join("");
  }

  function factLine(profile) {
    profile = profile || {};
    var bits = [];
    if (profile.hq) bits.push("Sitz " + profile.hq);
    if (profile.employeesDisplay) bits.push("Mitarbeiter " + profile.employeesDisplay);
    if (profile.marketCapDisplay) bits.push("Börsenwert " + profile.marketCapDisplay);
    return bits.join(" · ");
  }

  function showDetail(doc) {
    document.title = doc.ticker + " · sidequest";
    var thesis = doc.thesis || "These folgt";
    var thesisClass = thesis === "These folgt" ? "thesis placeholder" : "thesis";
    var price = priceText(doc);
    var priceDate = doc.price && doc.price.date ? dDE(doc.price.date) : DASH;
    var facts = factLine(doc.profile);
    var h = '<a class="back" href="#/">← Alle Positionen</a>';
    h += '<h1 class="h-red">' + esc(doc.ticker) + "</h1>";
    h += '<div class="r-name">' + esc(doc.name || "") + "</div>";
    h += '<div class="term">Kurs <b>' + esc(price) + "</b>";
    if (doc.price && doc.price.date) h += " · Schluss <b>" + esc(priceDate) + "</b>";
    if (doc.price && doc.price.source) h += " · " + esc(doc.price.source);
    h += "</div>";
    h += '<p class="mlabel" style="margin-top:18px">These</p>';
    h += '<p class="' + thesisClass + '">' + esc(thesis) + "</p>";
    h += '<div class="wrap"><table class="metrics"><thead><tr><th>Kennzahl</th><th>Wert</th><th>Periode</th><th>Quelle</th><th>Stand</th></tr></thead><tbody>' +
      metricRows(doc) + "</tbody></table></div>";
    if (facts) h += '<p class="facts">' + esc(facts) + "</p>";
    app.innerHTML = h;
    window.scrollTo(0, 0);
  }

  function tickerFromHash() {
    var raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    var part = raw.split("/").filter(Boolean)[0];
    if (!part) return null;
    var ticker = part.toUpperCase();
    return TICKERS.indexOf(ticker) === -1 ? null : ticker;
  }

  function show() {
    var ticker = tickerFromHash();
    if (!ticker) {
      showGrid();
      return;
    }
    var item = loaded.filter(function (row) { return row.ok && row.doc.ticker === ticker; })[0];
    if (item) showDetail(item.doc);
    else showGrid();
  }

  function loadTicker(ticker) {
    return fetch("data/" + ticker + "/metrics.json").then(function (response) {
      if (!response.ok) throw new Error(String(response.status));
      return response.json();
    }).then(function (doc) {
      if (!doc || doc.ticker !== ticker || !doc.metrics || doc.metrics.length !== 6) throw new Error("ticker");
      return doc;
    });
  }

  Promise.all(TICKERS.map(function (ticker) {
    return loadTicker(ticker).then(function (doc) { return {ok: true, doc: doc}; }, function () { return {ok: false, ticker: ticker}; });
  })).then(function (rows) {
    loaded = rows;
    window.addEventListener("hashchange", show);
    show();
  });
})();
  </script>
</body>
</html>
