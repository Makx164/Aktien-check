<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) { registration.unregister(); });
      }).catch(function () {});
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c10">
  <title>yoursidequest</title>
  <meta name="description" content="Coming soon.">
  <meta property="og:title" content="yoursidequest">
  <meta property="og:description" content="Coming soon.">
  <meta property="og:url" content="https://yoursidequest.org/">
  <meta property="og:type" content="website">
  <link rel="canonical" href="https://yoursidequest.org/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312141c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f3efe6'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("fonts/space-grotesk.woff2") format("woff2");
      font-weight: 300 700;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      color: #f3efe6;
      font-family: "Space Grotesk", system-ui, sans-serif;
      background:
        radial-gradient(1100px 640px at 12% -8%, rgba(188, 164, 255, 0.34), transparent 58%),
        radial-gradient(820px 560px at 108% 112%, rgba(255, 168, 112, 0.22), transparent 52%),
        linear-gradient(165deg, #161824 0%, #0b0c10 46%, #17140f 100%);
      background-size: 150% 150%, 150% 150%, 100% 100%;
      animation: drift 22s ease-in-out infinite alternate;
    }
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 32px 20px 12px;
    }
    h1 {
      margin: 0;
      max-width: 11ch;
      font-weight: 500;
      font-size: clamp(3.25rem, 13.5vw, 8.75rem);
      letter-spacing: -0.055em;
      line-height: 0.9;
      text-align: center;
      text-wrap: balance;
      animation: rise 1.15s cubic-bezier(.2, .7, .2, 1) both;
    }
    footer {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 1.1rem 1rem calc(1.35rem + env(safe-area-inset-bottom));
      font-size: 0.8125rem;
      letter-spacing: 0.06em;
    }
    footer a {
      color: rgba(243, 239, 230, 0.66);
      text-decoration: none;
    }
    footer a:hover,
    footer a:focus-visible {
      color: #f3efe6;
      text-decoration: underline;
      text-underline-offset: 0.25em;
    }
    @keyframes drift {
      from { background-position: 0% 0%, 100% 100%, 0 0; }
      to { background-position: 18% 10%, 78% 72%, 0 0; }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    @media (max-width: 420px) {
      main { padding: 24px 16px 8px; }
      h1 { font-size: clamp(2.85rem, 15vw, 4.25rem); }
      footer { gap: 1.15rem; font-size: 0.78rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, h1 { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming soon</h1>
  </main>
  <footer>
    <a href="datenschutz.html">Datenschutz</a>
  </footer>
</body>
</html>
