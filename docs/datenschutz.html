<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
/* Zielzuordnung für die alte GitHub-Pages-Adresse.
   Nur https://yoursidequest.org. Jeder andere Pfad endet auf der Startseite. */

var SIDEQUEST_ORIGIN = "https://yoursidequest.org";

function sidequestNormalizePath(pathname) {
  var path = String(pathname || "/");
  try { path = decodeURIComponent(path); } catch (e) {}
  var lower = path.toLowerCase();
  var base = "/aktien-check";
  if (lower === base) path = "/";
  else if (lower.indexOf(base + "/") === 0) path = path.slice(base.length) || "/";
  lower = path.toLowerCase();
  if (lower.length > 1 && lower.charAt(lower.length - 1) === "/") lower = lower.slice(0, -1);
  if (lower.slice(-11) === "/index.html") lower = lower.slice(0, -11);
  else if (lower === "index.html" || lower === "/index.html") lower = "/";
  else if (lower.slice(-5) === ".html") lower = lower.slice(0, -5);
  if (lower.slice(-6) === "/index") lower = lower.slice(0, -6);
  if (lower === "" || lower === "/") return "/";
  return lower;
}

function sidequestTarget(loc) {
  var path = sidequestNormalizePath(loc && loc.pathname);
  if (path === "/datenschutz") return SIDEQUEST_ORIGIN + "/datenschutz";
  return SIDEQUEST_ORIGIN + "/";
}
  (function () {
    var target = "https://yoursidequest.org/";
    try { target = sidequestTarget(location); } catch (e) {}
    if (typeof target !== "string" || target.indexOf("https://yoursidequest.org/") !== 0) {
      target = "https://yoursidequest.org/";
    }
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        }).catch(function () {});
      }
    } catch (e) {}
    location.replace(target);
  })();
  </script>
  <title>Datenschutz</title>
  <meta http-equiv="refresh" content="0; url=https://yoursidequest.org/datenschutz">
  <link rel="canonical" href="https://yoursidequest.org/datenschutz">
  <meta name="robots" content="noindex">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#c6c7c1;color:#111214;font:16px/1.5 system-ui,sans-serif}
    main{max-width:32rem;padding:24px}
    a{color:#c41c3a}
  </style>
</head>
<body>
  <main>
    <h1>Diese Seite ist umgezogen</h1>
    <p>Datenschutz: <a href="https://yoursidequest.org/datenschutz">yoursidequest.org/datenschutz</a></p>
  </main>
</body>
</html>
